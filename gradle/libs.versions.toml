[versions]
agp = "9.5.0"
coreKtx = "1.19.1"
appcompat = "1.8.0"
material = "1.14.0"
constraintlayout = "2.2.2"
recyclerview = "1.4.0"
activityKtx = "1.13.0"
fragmentKtx = "1.9.1"
lifecycle = "2.11.0"
